name: Update odds data

on:
  schedule:
    - cron: "*/5 * * * *"     # GitHub may delay or skip scheduled runs under load
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-odds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Fetch odds (Action Network + Pinnacle reference)
        # exits 2 if the Action Network feed fails, so nothing is deployed and the site keeps the previous data
        run: python odds_compare.py --web-json _site/data --site-dir /tmp/site --out /tmp/odds.csv --top 5

      - name: Feed check
        run: |
          python - <<'PY'
          import json
          m = json.load(open("_site/data/meta.json"))
          print("generated:", m["generated_et"], m["generated_utc"])
          print("counts:", m["counts"])
          print("pinnacle matched:", m["pinnacle_match"])
          ev = json.load(open("_site/data/ev.json")); arbs = json.load(open("_site/data/arbs.json"))
          print("ev games:", sorted({(r["start_iso"], r["game"]) for r in ev})[:40])
          print("arb games:", sorted({(a["start_utc"], a["game"]) for a in arbs}))
          PY

      - name: Assemble site
        run: |
          cp -r web/. _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
